name:                terra6
version:             0.1.0.0
github:              "zaydiscool777/terra6"
license:             BSD-3-Clause
author:              "Zayd Mohammed"
maintainer:          "zaydiscool777@gmail.com"
copyright:           "Zayd Mohammed"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/zaydiscool777/terra6#readme>

dependencies:
- base >= 4.7 && < 5
- bytestring
- vector
- h-raylib
- lens
- random
- indexed-traversable
- linear
- bytestring
- directory

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  terra6-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - terra6

tests:
  terra6-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - directory
    - terra6
